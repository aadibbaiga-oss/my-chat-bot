
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Chatbot</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2ff;
}

header {
    background: #4338ca;
    color: white;
    text-align: center;
    padding: 22px;
}

header h1 {
    margin: 0;
}

.container {
    max-width: 800px;
    margin: 25px auto;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 15px #0002;
}

#chatbox {
    height: 430px;
    overflow-y: auto;
    padding: 12px;
    background: #f8fafc;
    border-radius: 10px;
}

.message {
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    max-width: 85%;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #dbeafe;
    margin-left: auto;
    text-align: right;
}

.bot {
    background: #dcfce7;
    margin-right: auto;
}

.input-area {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    padding: 12px 18px;
    background: #4338ca;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #312e81;
}

button:disabled {
    opacity: .5;
}

.clear {
    background: #ef4444;
}

.typing {
    color: #64748b;
    padding: 10px;
}

@media(max-width:500px) {
    .container {
        margin: 10px;
        padding: 12px;
    }

    #chatbox {
        height: 55vh;
    }
}
</style>
</head>

<body>

<header>
    <h1>🤖 My AI Chatbot</h1>
    <p>Your Smart AI Friend</p>
</header>

<div class="container">

    <h2>Hello! 👋</h2>
    <p>Ask me anything.</p>

    <button class="clear" onclick="clearChat()">
        Clear Chat 🗑️
    </button>

    <div id="chatbox">
        <div class="message bot">
            Hello! 😊 I am your AI Chatbot.
            Ask me anything in Hindi or English!
        </div>
    </div>

    <div class="input-area">

        <input
            type="text"
            id="userInput"
            placeholder="Type your message..."
            maxlength="4000"
        >

        <button id="sendBtn" onclick="sendMessage()">
            Send ➤
        </button>

    </div>

</div>

<script>

// GROQ API SETTINGS

const API_KEY = "YOUR_GROQ_API_KEY";

const API_URL =
"https://api.groq.com/openai/v1/chat/completions";

const MODEL = "llama-3.3-70b-versatile";

// CHAT MEMORY

let conversation = [];

// SEND MESSAGE

async function sendMessage() {

    const input = document.getElementById("userInput");
    const button = document.getElementById("sendBtn");

    const question = input.value.trim();

    if (!question || button.disabled) return;

    if (API_KEY === "YOUR_GROQ_API_KEY") {
        alert("Please enter your Groq API Key!");
        return;
    }

    addMessage(question, "user");

    input.value = "";

    conversation.push({
        role: "user",
        content: question
    });

    button.disabled = true;
    button.innerText = "Thinking...";

    const typing = document.createElement("div");
    typing.className = "typing";
    typing.innerText = "🤖 AI is thinking...";

    document.getElementById("chatbox").appendChild(typing);

    scrollChat();

    try {

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + API_KEY
            },

            body: JSON.stringify({

                model: MODEL,

                messages: [

                    {
                        role: "system",
                        content: `
You are a friendly AI chatbot.
You can answer questions in Hindi and English.
Help users with education, mathematics, science,
technology, computers and general knowledge.
Give simple and useful answers.
Be polite and helpful.
                        `
                    },

                    ...conversation.slice(-12)

                ],

                temperature: 0.7,
                max_tokens: 1500

            })

        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error?.message || "API Error"
            );
        }

        const answer = data.choices?.[0]?.message?.content;

        if (!answer) {
            throw new Error("No response received.");
        }

        conversation.push({
            role: "assistant",
            content: answer
        });

        addMessage(answer, "bot");

    }

    catch(error) {

        conversation.pop();

        addMessage("❌ " + error.message, "bot");

    }

    finally {

        typing.remove();

        button.disabled = false;
        button.innerText = "Send ➤";

        input.focus();

    }

}

// ADD MESSAGE

function addMessage(text, type) {

    const chatbox = document.getElementById("chatbox");

    const message = document.createElement("div");

    message.className = "message " + type;

    message.textContent = text;

    chatbox.appendChild(message);

    scrollChat();

}

// SCROLL

function scrollChat() {

    const chatbox = document.getElementById("chatbox");

    chatbox.scrollTop = chatbox.scrollHeight;

}

// ENTER KEY

document.getElementById("userInput")
.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

// CLEAR CHAT

function clearChat() {

    if (!confirm("Do you want to clear chat?")) return;

    conversation = [];

    document.getElementById("chatbox").innerHTML = "";

    addMessage(
        "Hello! 😊 Welcome back. Ask me anything!",
        "bot"
    );

}

</script>

</body>
</html>
